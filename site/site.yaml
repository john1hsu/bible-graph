# Settings for the GitHub Pages site built by site/build.py.
title: Bible Graph
repo: john1hsu/bible-graph
repo_url: https://github.com/john1hsu/bible-graph
prefix: bg
headline: Know the Book, grow in the faith
intro: >-
  A growing, carefully sourced guide to the Bible for Christians who want to
  know it better: its books and key passages, people, places and events, the
  great themes and covenants, and how to read and study it well. Every article
  points you to the passages themselves, gives you questions for personal or
  group study, and cites the sources behind every claim.
search_example: Abraham
tagline: A citation-backed guide to the Bible's books, passages, people, places, themes and history, for Christians who want to know Scripture better.
footer: A new article is researched, checked against the text and added every hour.
# Where Scripture references link to. {ref} and {version} are filled in.
bible_url: https://www.biblegateway.com/passage/?search={ref}&version={version}
bible_version: NIV
fonts_url: https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500..700;1,500..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Inter:wght@400..600&display=swap
basis:
  scriptural: Stated in Scripture
  ecumenical: Shared across Christian traditions
  varies-by-tradition: Views differ across traditions
  consensus: Scholarly consensus
  debated: Debated by scholars
  misconception: Popular misconception
  historical: Historical record
  devotional: Study practice
domains: {}
theme:
  font_body: "'Source Serif 4', Georgia, serif"
  font_display: "'EB Garamond', Georgia, serif"
  font_ui: "'Inter', system-ui, sans-serif"
  hue_start: 350
  light:
    paper: "#F6F1E7"
    panel: "#FCF9F2"
    ink: "#221A16"
    ink-soft: "#40342C"
    muted: "#6A5D52"
    rule: "#E3D9C8"
    rule-strong: "#C7B79E"
    accent: "#7B2D26"
    accent-wash: "#F1DFD6"
    warn: "#8A4B12"
    warn-wash: "#F3E3CC"
    good: "#2F5F57"
    good-wash: "#D9EAE5"
  dark:
    paper: "#14110F"
    panel: "#1D1916"
