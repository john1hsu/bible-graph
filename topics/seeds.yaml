# Domains the hourly run draws from. Edit freely: add domains, remove ones you
# don't want, or add seed slugs to steer what gets written next. Seeds are
# suggestions, not a queue: skip any that already exist.
# Each domain becomes a SKOS ConceptScheme (bg:scheme/<domain>) in the graph.
#
# Goal: help Christians know the Bible better — what each book says and how it
# fits the whole story, the people, places and events, the great themes and
# covenants, how to read and study Scripture well, and the history behind the
# text — with every verse checked against the text and every claim cited.

domains:
  bible-basics:
    label: How the Bible is put together
    seeds: [the-bible, old-testament, new-testament, biblical-canon, deuterocanonical-books, inspiration-of-scripture, chapters-and-verses, biblical-languages, the-story-of-the-bible, how-the-books-are-ordered]
  old-testament-books:
    label: Old Testament books
    seeds: [pentateuch, genesis, exodus, deuteronomy, joshua, ruth, 1-samuel, psalms, proverbs, ecclesiastes, isaiah, jeremiah, daniel, jonah, the-twelve-minor-prophets]
  new-testament-books:
